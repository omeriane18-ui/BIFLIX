<body>
<div id="intro" aria-hidden="true">
  <div class="glow"></div>
  <div class="ni" dir="ltr"><b style="--i:0">B</b><b style="--i:1">F</b><b style="--i:2">L</b><b style="--i:3">I</b><b style="--i:4">X</b></div>
</div>
<header id="hd">

  <nav>
    <button class="on" data-f="all">الكل</button>
    <button data-f="movie">أفلام</button>
    <button data-f="series">مسلسلات</button>
    <button data-f="my">قائمتي</button>
  </nav>
  <input id="q" type="search" placeholder="ابحث عن فيلم أو مسلسل..." aria-label="بحث">

<main>
  <section id="hero"></section>
  <div id="rows" class="rows"></div>

<footer>BFLIX © <span id="y"></span> — موقع مريان بلال · بدون إعلانات · بدون تتبّع</footer>

<div id="modal"><div class="box" id="bx">
  <button class="x" id="cl">✕ إغلاق</button>
  <div id="dv" class="dv">
    <div class="poster" id="dp"></div>
    <div class="info">
      <h2 id="dt"></h2><div class="meta" id="dm"></div><p id="dd"></p>
      <button class="pri go" id="go">▶ شاهد الآن</button>
      <div class="bar">
        <button id="ml"><span id="mli">＋</span> <span id="mlt">أضف إلى قائمتي</span></button>

    </div>
  </div>

    <div class="player" id="pl"></div><div class="meta pb" id="pb"></div>
    <div class="eps" id="ep"></div>
    <button id="bk" style="margin-top:10px">رجوع للمعلومات</button>
  </div>
  <div class="sim" id="sim"></div>
</div></div>
