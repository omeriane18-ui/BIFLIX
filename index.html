<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BFLIX | أفلام ومسلسلات</title>
<meta name="description" content="BFLIX موقع لمشاهدة الأفلام والمسلسلات أونلاين بسهولة. تصفح أحدث الأفلام والمسلسلات وشاهدها مباشرة.">
<link rel="canonical" href="https://omeriane18-ui.github.io/BIFLIX/">
<meta name="theme-color" content="#0b0b10">
<meta property="og:type" content="website">
<meta property="og:title" content="BFLIX | أفلام ومسلسلات">
<meta property="og:description" content="شاهد أحدث الأفلام والمسلسلات على BFLIX.">
<meta property="og:url" content="https://omeriane18-ui.github.io/BIFLIX/">
<meta property="og:locale" content="ar_AR">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a class="logo" href="./">BFLIX</a>
  <nav>
    <button class="on" data-f="all">الكل</button>
    <button data-f="movie">أفلام</button>
    <button data-f="series">مسلسلات</button>
  </nav>
  <input id="q" type="search" placeholder="ابحث عن فيلم أو مسلسل...">
</header>
<main>
  <h2 id="ttl">أحدث الإضافات</h2>
  <div id="grid" class="grid"></div>
</main>
<footer>BFLIX © <span id="y"></span> — موقع مريان بلال · <a href="admin.html" style="opacity:.5">لوحة التحكم</a></footer>

<div id="modal"><div class="box">
  <button class="x" onclick="closeM()">✕ إغلاق</button>
  <div class="player" id="pl"></div><div class="meta" id="pb"></div>
  <h2 id="mt"></h2><div class="meta" id="mm"></div><p id="md"></p>
  <div class="eps" id="ep"></div>
</div></div>

<script src="app.js"></script>
<script>
let D=[],F='all';
document.getElementById('y').textContent=new Date().getFullYear();
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const L=D.filter(x=>(F==='all'||x.type===F)&&(!q||(x.title+' '+(x.genre||'')).toLowerCase().includes(q)));
  document.getElementById('grid').innerHTML=L.length?L.map(x=>`<div class="card" onclick="openM('${esc(x.id)}')"><div class="poster">${x.poster?`<img src="${esc(x.poster)}" alt="${esc(x.title)}" loading="lazy" onerror="this.remove()">`:esc(x.title[0]||'B')}</div><div class="i"><b>${esc(x.title)}</b><small>${x.type==='series'?'مسلسل':'فيلم'}${x.year?' · '+esc(x.year):''}</small></div></div>`).join(''):'<div class="empty" style="grid-column:1/-1">لا توجد نتائج</div>';
}
function play(u){mountPlayer(document.getElementById('pl'),document.getElementById('pb'),u)}
function openM(id){
  const x=D.find(i=>i.id===id);if(!x)return;
  if(window.track)track(x.title,x.type);
  document.getElementById('mt').textContent=x.title;
  document.getElementById('mm').textContent=[x.type==='series'?'مسلسل':'فيلم',x.year,x.genre].filter(Boolean).join(' · ');
  document.getElementById('md').textContent=x.desc||'';
  const ep=document.getElementById('ep');ep.innerHTML='';
  if(x.type==='series'&&x.eps&&x.eps.length){
    x.eps.forEach((e,i)=>{const b=document.createElement('button');b.textContent=e.t||('الحلقة '+(i+1));
      b.onclick=()=>{[...ep.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');play(e.u)};ep.appendChild(b)});
    ep.firstChild.click();
  }else play(x.url);
  document.getElementById('modal').classList.add('open');
}
function closeM(){document.getElementById('modal').classList.remove('open');document.getElementById('pl').innerHTML='';document.getElementById('pb').innerHTML=''}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeM()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
document.getElementById('q').oninput=render;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(c=>c.classList.remove('on'));b.classList.add('on');F=b.dataset.f;
  document.getElementById('ttl').textContent={all:'أحدث الإضافات',movie:'الأفلام',series:'المسلسلات'}[F];render()});
window.setD=d=>{D=d;render()};
</script>
<script type="module">
import {fetchItems,app} from './firebase.js';
import {getAnalytics,logEvent,isSupported} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
fetchItems().then(window.setD);
isSupported().then(ok=>{if(!ok)return;const a=getAnalytics(app);window.track=(t,ty)=>logEvent(a,'select_content',{content_type:ty,item_id:t})}).catch(()=>{});
</script>
</body>
</html>
